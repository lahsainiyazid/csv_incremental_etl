[project]
name = "incremental-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lahsaini Yazid", email = "lahsainitv@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "matplotlib>=3.11.2",
    "notebook>=7.6.5",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "scikit-learn>=1.9.1",
]

[project.scripts]
incremental-etl = "incremental_etl:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
